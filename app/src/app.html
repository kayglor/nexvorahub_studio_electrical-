<title>NexvoraHub Studio – MEP Building Services Design</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: switchroom-panel app — sticky status band, numbered design-stage rail, working sheet; report renders as an A4 calc document */
:root{
  --bg:#eef0ec; --panel:#ffffff; --sunk:#f6f7f4; --ink:#1b2220; --muted:#5b6662; --line:#d3d8d2; --line-strong:#a9b2ac;
  --accent:#b9471a; --accent-soft:#f6e3d8; --on-accent:#ffffff;
  --ok:#2c7a4b; --ok-soft:#dcefe3; --warn:#9a6a0b; --warn-soft:#f6ecd2; --bad:#b0281f; --bad-soft:#f7dcd9;
  --input:#fffdf6; --input-line:#cdbf94;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow","Segoe UI",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",Consolas,"Courier New",monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121715; --panel:#1a201e; --sunk:#151a18; --ink:#e3e8e4; --muted:#98a39e; --line:#2c3531; --line-strong:#47524d;
  --accent:#ef7d43; --accent-soft:#3a2418; --on-accent:#1a0e07;
  --ok:#5fc08a; --ok-soft:#183324; --warn:#e0b14e; --warn-soft:#33290f; --bad:#f07d73; --bad-soft:#3b1a17;
  --input:#1f2421; --input-line:#5a5236; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121715; --panel:#1a201e; --sunk:#151a18; --ink:#e3e8e4; --muted:#98a39e; --line:#2c3531; --line-strong:#47524d;
  --accent:#ef7d43; --accent-soft:#3a2418; --on-accent:#1a0e07;
  --ok:#5fc08a; --ok-soft:#183324; --warn:#e0b14e; --warn-soft:#33290f; --bad:#f07d73; --bad-soft:#3b1a17;
  --input:#1f2421; --input-line:#5a5236; color-scheme:dark}
*{box-sizing:border-box}
/* Role workspaces, registration and My tasks */
.rolegrid label.role{position:relative;display:flex;flex-direction:column;gap:4px;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:12px 14px;cursor:pointer}
.rolegrid label.role input{position:absolute;opacity:0;pointer-events:none}
.rolegrid label.role:has(input:checked),.rolegrid label.role.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.rolegrid label.role b::after{content:'';float:right;width:18px;height:18px;border-radius:50%;border:2px solid var(--line);box-sizing:border-box;margin-top:4px}.rolegrid label.role.on b::after{content:'✓';border-color:var(--accent);background:var(--accent);color:#fff;font-size:12px;line-height:14px;text-align:center}
.regacts{position:sticky;bottom:0;z-index:2;background:var(--card,#fff);padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}.regacts .bad-msg{color:var(--bad,#b3261e);font-weight:600}#roles,.rolegrid,#regName{scroll-margin-top:130px}.roles input.miss{outline:2px solid var(--bad,#b3261e)}.rolegrid.miss{outline:2px solid var(--bad,#b3261e);outline-offset:4px;border-radius:8px}
.rolegrid label.role:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.rolegrid label.role b{font-family:var(--f-display);font-size:20px}.rolegrid label.role span{font-size:13.5px;color:var(--muted)}.rolegrid label.role small{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);margin-top:auto}
ol.tasks{list-style:none;margin:0;padding:0;display:grid;gap:6px}
ol.tasks li{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;border:1px solid var(--line);border-left:4px solid var(--line-strong);border-radius:6px;padding:9px 12px;background:var(--panel)}
ol.tasks li.bad{border-left-color:var(--bad)}ol.tasks li.warn{border-left-color:var(--warn)}ol.tasks li.info{border-left-color:var(--accent)}
ol.tasks b{font-size:14.5px}ol.tasks p{margin:2px 0 0;font-size:13.5px;color:var(--muted)}
ol.tasks .tm{display:flex;flex-direction:column;align-items:flex-end;gap:3px;white-space:nowrap;font-size:13px}
ol.tasks .tm a{font-weight:600;color:var(--accent)}ol.tasks .due{font-family:var(--f-mono);color:var(--muted)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
@media (max-width:600px){ol.tasks li{flex-direction:column}ol.tasks .tm{align-items:flex-start;flex-direction:row;gap:12px}}
.rolegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:10px}
.rolegrid .role{display:flex;flex-direction:column;gap:4px;text-align:left;font:inherit;color:inherit;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:12px 14px;cursor:pointer}
.rolegrid .role:hover{border-color:var(--line-strong)}
.rolegrid .role.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.rolegrid .role b{font-family:var(--f-display);font-size:20px}
.rolegrid .role span{font-size:13.5px;color:var(--muted)}
.rolegrid .role small{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);margin-top:auto}
.roles .yours{margin-top:14px}.roles .yours h3{margin:0 0 6px}
.roles .chain a{background:var(--sunk);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:14px;color:var(--ink);text-decoration:none}
.roles .chain a.ed{border-color:var(--accent)}.roles .chain a i{font-style:normal;font-size:11.5px;color:var(--muted);font-family:var(--f-mono)}
.role-chip{font-size:13px;font-weight:600;color:var(--accent);text-decoration:none;white-space:nowrap;border:1px solid var(--line);border-radius:99px;padding:3px 10px}
nav.rail a .lk{font-style:normal;font-size:11px;color:var(--muted)}
.ro-note{margin:0 0 12px}
main input:disabled,main select:disabled,main textarea:disabled{opacity:.75;cursor:not-allowed}
/* Intro player: a short animated film of the life cycle, drawn in SVG and played scene by scene */
.vidg{margin:14px 0 0;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}.vidg video{width:100%;aspect-ratio:16/9;border-radius:10px;background:#0a1210;border:1px solid #24322d;display:block}.vidg h3,.contact h3{margin:0 0 6px;font-family:var(--f-display);font-size:19px}.vidg p,.contact p{margin:0 0 10px;color:var(--muted);font-size:14px}.vidg .row,.contact .row{display:flex;gap:8px;flex-wrap:wrap}
.contact{margin:14px 0 0;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}.contact a.mail{font-weight:600;word-break:break-all}
@media (max-width:760px){.vidg{grid-template-columns:1fr}}
.intro{border-radius:10px;overflow:hidden;background:#0a1210;border:1px solid #24322d;color:#e9f1ec}
.intro .stage{position:relative;aspect-ratio:16/7.5;background:radial-gradient(120% 140% at 80% 0%,#1d342e 0%,#0d1916 55%,#0a1210 100%)}
.intro .stage svg{position:absolute;left:0;right:0;bottom:0;top:34px;width:100%;height:calc(100% - 34px)}
.intro .ttl{position:absolute;left:18px;top:14px;font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#7fe0b0}
.intro .poster{position:absolute;inset:0;display:grid;place-items:center;background:rgba(6,12,10,.55)}
.intro .poster button{display:flex;align-items:center;gap:12px;font:inherit;font-weight:600;font-size:17px;color:#1a0e07;background:#ef7d43;border:0;border-radius:999px;padding:12px 22px 12px 14px;cursor:pointer}
.intro .poster button:focus-visible,.intro .ctl button:focus-visible{outline:2px solid #7fe0b0;outline-offset:2px}
.intro .pbtns{display:flex;flex-direction:column;gap:10px;align-items:stretch}.intro .poster button.alt{background:transparent;color:#e9f1ec;border:1px solid #7fe0b0}.intro .poster button.alt i{background:#7fe0b0;color:#0a1210}
.intro .films{display:inline-flex;border:1px solid #4d6a5f;border-radius:6px;overflow:hidden}.intro .films button{border:0;border-radius:0;min-width:0}.intro .films button[aria-pressed="true"]{background:#7fe0b0;color:#0a1210}
.intro .poster i{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#1a0e07;color:#ef7d43;font-style:normal;font-size:14px}
.intro .segs{display:flex;gap:4px;padding:10px 14px 0}
.intro .segs i{flex:1;height:4px;border-radius:2px;background:#24322d;overflow:hidden}
.intro .segs b{display:block;height:100%;width:0;background:#7fe0b0}
.intro .segs i.done b{width:100%}
.intro .segs i.cur b{animation:segfill var(--dur,5.2s) linear forwards}
.intro.paused .segs i.cur b{animation-play-state:paused}
.intro:not(.started) .segs i.cur b{animation:none;width:0}
@keyframes segfill{to{width:100%}}
.intro .ctl{display:flex;align-items:center;gap:10px;padding:10px 14px 12px;flex-wrap:wrap}
.intro .ctl button{font:inherit;font-weight:600;font-size:13px;color:#e9f1ec;background:transparent;border:1px solid #4d6a5f;border-radius:6px;padding:5px 11px;cursor:pointer;min-width:38px}
.intro .ctl button:disabled{opacity:.4;cursor:default}
.intro .cap{flex:1 1 260px;font-size:14.5px;color:#c4d3cb;min-width:0}
.intro .cap b{color:#ffb184;font-weight:600}
/* scene marks */
.sc text{font-family:var(--f-mono);fill:#c4d3cb;font-size:13px}
.sc .big{font-family:var(--f-display);font-weight:700;font-size:46px;fill:#ffb184}
.sc .hd{font-family:var(--f-display);font-weight:700;font-size:30px;fill:#e9f1ec}
.sc .ln{stroke:#7fe0b0;stroke-width:2.5;fill:none}
.sc .lo{stroke:#ef7d43;stroke-width:3;fill:none}
.sc .bx{fill:#12241f;stroke:#4d6a5f;stroke-width:1.5}
.sc .on{fill:#ef7d43}
.sc .gr{fill:#7fe0b0}
.sc .dr{stroke-dasharray:600;stroke-dashoffset:600;animation:drawln 1.4s ease-out forwards}
.sc .pop{opacity:0;transform-box:fill-box;transform-origin:center;animation:popin .5s cubic-bezier(.2,.9,.3,1.3) forwards}
.sc .fade{opacity:0;animation:fadein .7s ease-out forwards}
.sc .grow{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);animation:growy .9s ease-out forwards}
.sc .spin{transform-box:view-box;animation:needle 2.6s ease-in-out forwards}
@keyframes drawln{to{stroke-dashoffset:0}}
@keyframes popin{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@keyframes fadein{to{opacity:1}}
@keyframes growy{to{transform:scaleY(1)}}
@keyframes needle{0%{transform:rotate(-70deg)}60%{transform:rotate(30deg)}100%{transform:rotate(18deg)}}
.intro.still .sc .dr{stroke-dashoffset:0;animation:none}.intro.still .sc .pop,.intro.still .sc .fade{opacity:1;animation:none}.intro.still .sc .grow{transform:none;animation:none}.intro.still .sc .spin{animation:none;transform:rotate(18deg)}
@media (max-width:600px){.intro .poster button{font-size:13.5px;padding:7px 14px 7px 7px;gap:8px}.intro .poster i{width:26px;height:26px;font-size:11px}.intro .pbtns{gap:7px}.intro .ctl{gap:8px}.intro .stage{aspect-ratio:16/10}.intro .cap{font-size:13.5px}}

/* Advisor: help guide and next best steps, opened from the status band */
.adv-btn{display:inline-flex;align-items:center;gap:7px}
.adv-btn .c{font-family:var(--f-mono);font-size:11.5px;background:var(--accent);color:var(--on-accent);border-radius:99px;padding:1px 7px}
.adv-btn .c:empty{display:none}
aside.adv{position:fixed;top:0;right:0;bottom:0;width:min(420px,100vw);z-index:30;background:var(--panel);border-left:1px solid var(--line);box-shadow:-10px 0 30px rgba(0,0,0,.18);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
aside.adv[hidden]{display:none}
.adv .ah{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.adv .ah h2{margin:0;font-family:var(--f-display);font-size:24px;flex:1}
.adv .ah small{display:block;font-family:var(--f-body);font-size:12.5px;color:var(--muted);font-weight:400}
.adv .tabs{display:flex;gap:4px;padding:10px 16px 0;border-bottom:1px solid var(--line)}
.adv .tabs button{font:inherit;font-weight:600;font-size:14px;background:transparent;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:6px 10px 8px;cursor:pointer}
.adv .tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.adv .ab{overflow:auto;padding:14px 16px 20px;flex:1}
.adv .score{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.adv .score .bar{flex:1}
.adv .score b{font-family:var(--f-mono);font-weight:500}
.adv ol.steps{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.adv .steps li{border:1px solid var(--line);border-left:4px solid var(--line-strong);border-radius:6px;padding:9px 11px;background:var(--sunk)}
.adv .steps li.bad{border-left-color:var(--bad)}.adv .steps li.warn{border-left-color:var(--warn)}.adv .steps li.ok{border-left-color:var(--ok)}.adv .steps li.info{border-left-color:var(--accent)}
.adv .steps b{display:block;font-size:14.5px}
.adv .steps p{margin:3px 0 0;font-size:13.5px;color:var(--muted)}
.adv .steps a{display:inline-block;margin-top:5px;font-weight:600;font-size:13.5px;color:var(--accent)}
.adv h3{font-family:var(--f-display);font-size:19px;margin:16px 0 6px}
.adv h3:first-child{margin-top:0}
.adv ul{margin:0;padding-left:18px;font-size:14px}
.adv ul li{margin:3px 0}
.adv .q{width:100%;font:inherit;padding:9px 11px;border:1px solid var(--input-line);background:var(--input);color:var(--ink);border-radius:6px}
.adv .chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.adv .chips button{font:inherit;font-size:13px;background:var(--sunk);border:1px solid var(--line);border-radius:99px;padding:3px 10px;cursor:pointer;color:var(--ink)}
.adv details{border:1px solid var(--line);border-radius:6px;padding:8px 11px;margin-bottom:8px;background:var(--sunk)}
.adv details summary{font-weight:600;cursor:pointer;font-size:14.5px}
.adv details p{margin:6px 0 0;font-size:14px}
.adv details a{font-weight:600;color:var(--accent);font-size:13.5px}
.adv .af{border-top:1px solid var(--line);padding:10px 16px;font-size:12px;color:var(--muted)}
@media print{aside.adv,.adv-btn,.chat-fab,aside.chat{display:none!important}}
.faq-cats{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}.faq-cats a{font-size:13px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;text-decoration:none;color:inherit;background:var(--panel)}
.faq h3{margin:22px 0 8px;font-family:var(--f-display);font-size:20px}.faq details{border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin:0 0 8px;background:var(--panel)}.faq summary{cursor:pointer;font-weight:600}.faq details p{margin:8px 0 6px;color:var(--muted)}
.faq input.q{width:100%;max-width:560px;padding:10px 12px;font-size:15px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:inherit}
.chat-fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:25;border-radius:999px;padding:11px 16px;font-weight:600;border:0;background:var(--accent,#1f7a5a);color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.25);cursor:pointer;font-size:14px}
aside.chat{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(390px,calc(100vw - 24px));height:min(580px,calc(100vh - 24px));z-index:32;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 36px rgba(0,0,0,.28);display:flex;flex-direction:column;overflow:hidden}
aside.chat[hidden]{display:none}.chat .ch{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}.chat .ch h2{margin:0;flex:1;font-family:var(--f-display);font-size:20px}.chat .ch small{display:block;font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:400}
.chat .log{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px}.chat .m{max-width:88%;padding:9px 12px;border-radius:12px;font-size:14px;line-height:1.45}.chat .m.bot{align-self:flex-start;background:var(--bg);border:1px solid var(--line)}.chat .m.me{align-self:flex-end;background:var(--accent,#1f7a5a);color:#fff}
.chat .m a{display:inline-block;margin-top:6px;font-weight:600}.chat .sg{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chat .sg button{font-size:12.5px;padding:4px 9px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:inherit;cursor:pointer;text-align:left}
.chat .cf{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}.chat .cf input{flex:1;min-width:0;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:inherit;font-size:15px}.chat .cn{padding:0 14px 10px;font-size:11.5px;color:var(--muted)}
.toast{bottom:calc(72px + env(safe-area-inset-bottom,0px))}
@media (max-width:600px){aside.chat{right:0;bottom:0;width:100vw;height:100dvh;border-radius:0}}
/* Welcome page: dark control-room hero with a live "busbar" of the project life cycle */
.home{display:grid;gap:18px;min-width:0}
.hero{position:relative;overflow:hidden;border-radius:10px;padding:34px 30px 26px;color:#e9f1ec;background:radial-gradient(120% 140% at 85% 0%,#1f3a33 0%,#0f1c18 45%,#0a1210 100%);border:1px solid #24322d}
.hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(140,255,200,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(140,255,200,.05) 1px,transparent 1px);background-size:28px 28px;mask-image:radial-gradient(90% 90% at 70% 20%,#000 30%,transparent 80%);pointer-events:none}
.hero>*{position:relative}
.hero .k{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#7fe0b0}
.hero h1{font-family:var(--f-display);font-weight:700;font-size:clamp(30px,5vw,52px);line-height:1.02;margin:10px 0 12px;max-width:22ch;letter-spacing:.01em}
.hero h1 em{font-style:normal;color:#ffb184}
.hero p.lead{font-size:17px;max-width:62ch;color:#c4d3cb;margin:0 0 18px}
.hero .acts{display:flex;flex-wrap:wrap;gap:10px}
.hero .btn{background:transparent;color:#e9f1ec;border-color:#4d6a5f}
.hero .btn.primary{background:#ef7d43;border-color:#ef7d43;color:#1a0e07}
.hero .btn:focus-visible{outline:2px solid #7fe0b0;outline-offset:2px}
.bus{width:100%;height:auto;margin:22px 0 4px;display:block}
.bus .rail{stroke:#2f4a41;stroke-width:6;stroke-linecap:round}
.bus .flow{stroke:#7fe0b0;stroke-width:2.5;stroke-dasharray:6 18;fill:none;animation:busflow 2.4s linear infinite}
.bus .node{fill:#0f1c18;stroke:#7fe0b0;stroke-width:2.5}
.bus .node.on{fill:#ef7d43;stroke:#ffb184}
.bus .halo{fill:none;stroke:#7fe0b0;stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3s ease-out infinite}
.bus text{fill:#c4d3cb;font-family:var(--f-mono);font-size:13px;letter-spacing:.06em;text-anchor:middle}
@keyframes busflow{to{stroke-dashoffset:-48}}
@keyframes halo{0%{transform:scale(1);opacity:.7}80%,100%{transform:scale(2.4);opacity:0}}
@media (prefers-reduced-motion:reduce){.bus .flow,.bus .halo{animation:none}.bus .halo{display:none}}
.hero .snap{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:14px;font-family:var(--f-mono);font-size:13px;color:#9fb6ab}
.hero .snap b{color:#e9f1ec;font-weight:500}
.life{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(210px,100%),1fr));gap:12px}
.life a.card{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;border-top:4px solid var(--accent);transition:transform .15s ease,box-shadow .15s ease}
.life a.card:hover,.life a.card:focus-visible{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.12);outline:none}
.life .n{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.life h3{font-family:var(--f-display);font-size:24px;margin:0;letter-spacing:.01em}
.life p{margin:0;color:var(--muted);font-size:14px}
.life .fig{font-family:var(--f-mono);font-size:13px;margin-top:auto;padding-top:8px;border-top:1px dashed var(--line)}
.life .go{font-weight:600;color:var(--accent);font-size:14px}

function railStatus(id) {
  if (id === 'mech' || id === 'plumb' || id === 'treat' || id === 'mepcomp') return mepRail(id);
  if (id === 'circuits') return R.C.some(c => c.fail && c.fail !== 'REVIEW') ? 'bad' : R.C.some(c => c.fail === 'REVIEW') ? 'warn' : 'ok';
  if (id === 'compliance') { const st = CHECKS.map(c => c[2](R)[1]); return st.includes('bad') ? 'bad' : st.includes('warn') ? 'warn' : 'ok'; }
  if (id === 'sizing') return R.txKva ? 'ok' : 'bad';
  if (id === 'review') return !R.RV.sheets.length ? '' : R.RV.nBad ? 'bad' : R.RV.nWarn ? 'warn' : 'ok';
  if (id === 'checklist' || id === 'facilities') { const st = clStat(id === 'facilities' ? facIds() : CL_CHECKLIST.flatMap(([set, , items]) => clIds(set, items))); return st.complete ? 'ok' : st.started ? 'warn' : ''; }
  if (id === 'dashboard') { const o = calcDash().overall; return o === 'Red' ? 'bad' : o === 'Amber' ? 'warn' : o === 'Green' ? 'ok' : ''; }
  if (id === 'lvcert') { const L = calcLV(); return L.fail || L.inspFail ? 'bad' : L.overall === 'Satisfactory' ? 'ok' : L.rows.some(o => o.done) || L.inspDone ? 'warn' : ''; }
  if (id === 'registers') { if (!(S.docs || []).length && !(S.risks || []).length) return ''; const G = calcRegs(); return G.vhigh || G.overdue ? 'bad' : G.high || G.waiting || G.lateR ? 'warn' : 'ok'; }
  if (id === 'tc') { const T = calcTC(); return T.fail ? 'bad' : !T.started ? '' : T.done < T.total ? 'warn' : 'ok'; }
  if (id === 'fm') { if (!(S.tickets || []).length && !(S.soft || []).length && !(S.capProj || []).length) return ''; const F = calcFM(); return F.overdue || F.soft.some(r => r.st === 'bad') || F.pr.some(r => r.rag === 'Red') ? 'bad' : F.open || F.soft.some(r => r.st === 'warn') || F.pr.some(r => r.rag === 'Amber') ? 'warn' : 'ok'; }
  if (id === 'assets') { if (!(S.assets || []).length) return ''; const A = calcAssets(); return A.nBad ? 'bad' : A.nWarn ? 'warn' : 'ok'; }
  if (id === 'fmboard') return fmbStatus();
  if (id === 'drawings') return !R.W.rooms.length ? '' : R.W.nBad ? 'bad' : R.W.nWarn ? 'warn' : 'ok';
  return '';
}

const ADV_HELP = [
  ['How do I contact the developer with an idea or a problem?', 'Email ' + CONTACT + ' – or use ✉ Contact the developer at the bottom of the stage menu or on the Welcome page, which starts an email with the page, your role and your browser filled in. Ideas, bugs and missing standards are all welcome.', 'home'],
  ['Is there a chatbot or an FAQ?', 'Yes. Press 💬 Ask a question at the bottom right of any page to chat with the help assistant – it answers from these FAQs and from your project (try “what should I do next?”), works offline and sends nothing anywhere. The full FAQ is at ❓ FAQ at the bottom of the stage menu.', 'faq'],
  ['Is the app free?', 'Yes – the app is free to use. Results are a design pre-check, not certification.', 'home'],
  ['Does it work offline?', 'Yes. Once loaded, everything runs in your browser. You can also keep the offline copy of the app (a single HTML file) and open it without an internet connection – the FAQ, help assistant and the MP4 video guide are all inside it.', 'home'],
  ['Can I use it on a phone or tablet?', 'Yes. On a phone the stage menu becomes a scrolling bar at the top, and the project file buttons, guides and contact links are at the foot of the page. Large tables scroll sideways.', 'home'],
  ['Can several people work on one project?', 'Yes – share the project (.json) file. Each person registers their own role in their own browser, so the same file opens with the right stages for each of them. The Admin centre keeps the team and the project log.', 'admin'],
  ['How do I explore the worked example?', 'The app opens with a worked example filled in on every stage. Press “Explore the worked example” on the Welcome page and step through the menu to see how each stage feeds the next. When you are ready, use “Start a new project”.', 'home'],
  ['Why do some stages say “view”?', 'Stages owned by other roles open view only for your registered role, so you can read and export them but not change them. The project lead and project controller have full access. Change your role on the Welcome page if you need to.', 'home'],
  ['How do I change my role?', 'Go to the Welcome page and pick a different role, then register again. The menu, My tasks and the Advisor follow the new role straight away. The project file is not affected.', 'home'],
  ['Is there a dark mode?', 'Yes – the app follows your device’s light or dark setting automatically.', 'home'],
  ['Which countries are covered?', 'Over 90 countries. Choose yours on Project & region; it sets the voltage, frequency, voltage-drop limits, wiring rules and factors. Regional coverage shows how far the results can be relied on in each region and what to confirm locally.', 'coverage'],
  ['Can I get the report in another language?', 'Yes. On Design report choose the report language – English, French, Spanish, Portuguese or Arabic. Headings, labels and standard text are translated; technical values, code references and the names you entered stay as they are.', 'report'],
  ['What do the dashboard colours mean?', 'Green is complete, amber needs review and red needs action. The colours are calculated from the project, so fix the cause in its stage and the dashboard updates. The dashboard also lists the HV standards for the region.', 'dashboard'],
  ['How do I check the design before issue?', 'Work through Compliance (red items need action, amber need review) and the Design checklist, which records every parameter used and its source. Fewer assumptions make a stronger design report.', 'checklist'],
  ['Why is maximum demand lower than the connected load?', 'Diversity, utilisation and power factor are applied by load category, because not everything runs at full load at once. The full build-up is on Supply & equipment, and every factor can be overridden.', 'sizing'],
  ['How do I add spare capacity to the transformer?', 'On Supply & equipment set the spare capacity you want to carry; the transformer and main switchboard are selected from maximum demand plus that margin. Change spare capacity or diversity deliberately rather than forcing a size.', 'sizing'],
  ['Does the generator allow for motor starting?', 'Yes. The generator is sized for the essential loads and for the starting current of large motors such as lifts and fire pumps. Check lift and pump starting methods on Lifts & pumps.', 'sizing'],
  ['How are cables derated?', 'Enter the installation method, ambient temperature and grouping for each circuit on Cables & protection; the rating factors are applied before the cable is checked for current capacity and voltage drop. Real lengths and grouping matter most.', 'circuits'],
  ['When is an RCD needed?', 'Where the regional rules call for additional protection, the circuit check looks for a 30 mA RCD (GFCI in North America) on final circuits. If a circuit fails for this reason, add RCD protection to it.', 'circuits'],
  ['How do I add solar PV and batteries?', 'On Energy management tick the efficiency measures you will deliver and add PV and batteries. Annual energy, cost and carbon update with regional carbon factors, which you can edit.', 'energy'],
  ['Which data centre Tier should I choose?', 'Tier I (basic capacity) to Tier IV (fault tolerant) set the redundancy of UPS, generators and cooling. Pick the Tier the client needs on Data centre, then review UPS modules, autonomy and generator size.', 'data-centre'],
  ['What does PUE change?', 'Power usage effectiveness sets the cooling and support load on top of the IT load, so it drives the mechanical load and the transformer size. Keep it realistic for the cooling system you plan.', 'data-centre'],
  ['How do I read my AutoCAD drawings into the app?', 'On Drawing review import a DXF (ASCII) drawing. The app learns the legend and counts symbols room by room. A clean legend in the drawing gives the most reliable counts.', 'review'],
  ['Which DXF version does the app save?', 'Drawings are saved as DXF R12, which opens in AutoCAD and most CAD software. Treat them as a first layout and coordinate with the architecture before issue.', 'drawings'],
  ['How are heating and cooling loads calculated?', 'On Mechanical services pick the system and heat source and check the design temperatures, then enter wall, glazing and roof areas for each zone from the drawings. The plant, ducts, pipes, pumps and fans are sized from the result.', 'mech'],
  ['How do I size water storage and booster pumps?', 'On Plumbing & drainage list the fixtures by location. Cold and hot water, storage, booster pumps and foul and rainwater drainage are sized from the fixture schedule.', 'plumb'],
  ['Which mechanical and plumbing regulations are checked?', 'MEP compliance uses the method set chosen on Mechanical services. Confirm the edition adopted locally – for example the Building Regulations of Scotland, Wales or Northern Ireland, or a state plumbing code.', 'mepcomp'],
  ['How do I size swimming pool plant?', 'On Water & sewage treatment choose the pool option and its use; the equipment, power and control panel follow, with the options compared for power and energy.', 'treat'],
  ['How is a risk scored?', 'In the risk register on Documents & risks each risk is scored likelihood × impact. Keep the residual risk current – it is what the client reads.', 'registers'],
  ['What are P1 to P4 on tickets?', 'The priority of a maintenance ticket, from P1 (most urgent) to P4. Each has response and completion targets, set on FM operations, which the SLA is measured against.', 'fm'],
  ['How do I plan asset replacements?', 'On Assets & maintenance set the year, cost and condition of each asset to get the replacement date, then move end-of-life items into capital projects.', 'assets'],
  ['How do I report facilities performance?', 'Facilities report shows equipment state, tickets and SLA, soft services, capital projects and life cycle. Save it as PDF, CSV or Excel – the Excel version suits monthly trend tracking.', 'fmreport'],
  ['How do I hold a stage gate?', 'In the Admin centre open the life-cycle stage, hold its gate review and record who approved it and when. Passing a gate moves the project on to the next stage.', 'admin'],
  ['How do I use the app? Is there a video guide?', 'Yes – there is a 2-minute narrated MP4 video guide with captions on the Welcome page (🎬 Video guide at the bottom of the stage menu), and you can download it. Or press ▶ How to use the app for the animated guide. The 1-minute guide shows how to register, find your way with the stage menu, read the live figures, enter data, use My tasks and the Advisor, export, and save and share the project file.', 'home'],
  ['Who manages the whole project life cycle?', 'Register as Project controller. The Admin centre shows every life-cycle stage from concept to end of life with live progress, a stage gate for each, the programme and budget, the team and their access, and the project log.', 'admin'],
  ['How do I choose a water, sewage or pool treatment system?', 'Open Water & sewage treatment. Each dropdown lists the options open to the client and consultant with what they suit, their pros and cons, and a suggested option from the raw water, flows or pool use. The comparison tables show power and energy for each option and capacity.', 'treat'],
  ['Where are the mechanical and plumbing designs?', 'Mechanical services, Plumbing & drainage and MEP compliance sit after Energy management. They use the same zones as the electrical area schedule.', 'mech'],
  ['How do MEP loads reach the electrical design?', 'On Mechanical services or Plumbing & drainage press "Send MEP loads to the electrical design". Heat pumps, chillers, fans and water heating become equipment loads, and pumps go to Lifts & pumps, so the maximum demand includes them.', 'mech'],
  ['Where do I start a new project?', 'Use "Start a new project" on the Welcome page, or "New blank project" under Project file – at the foot of the stage menu, or at the foot of the page on a phone (press it twice to confirm). Set the country on Project & region first, then add loads.', 'project'],
  ['How do I save or reopen my work?', 'Work saves automatically in this browser. Use "Save project (.json + PDF)" to keep a copy, and "Open project (.json)" to load it on another computer or browser.', 'home'],
  ['How is maximum demand calculated?', 'Connected load from area densities, equipment, lifts, pumps and the data centre, with power factor, utilisation and diversity applied by category. The build-up is shown on Supply & equipment.', 'sizing'],
  ['Why is my circuit failing?', 'The reason is shown against the circuit: current capacity, voltage drop, earth fault loop (Zs), breaking capacity or RCD. Change cable size, length, device type or curve, or add an RCD.', 'circuits'],
  ['Voltage drop too high', 'Shorten the run, increase the cable size, or move the board closer to the load. Limits come from the region and are shown on Project & region.', 'circuits'],
  ['Zs too high / earth fault loop', 'Increase the cable or CPC size, shorten the run, use a lower-rated or different-curve device, or provide RCD protection. Measured Zs is checked against 0.8 × the tabulated maximum.', 'circuits'],
  ['Can I change factors and limits?', 'Yes. Every factor, density, limit and certificate field is an editable default – type your own value and it is used everywhere. You remain the certifying engineer.', 'checklist'],
  ['Which wiring standard is used?', 'The one for the country you pick – for the UK, BS 7671:2018+A4:2026. HV standards by region are listed on the Project dashboard.', 'project'],
  ['How do I size the transformer and generator?', 'Supply & equipment selects them from maximum demand plus your spare capacity, and sizes the generator for the essential loads and motor starting.', 'sizing'],
  ['How do I produce drawings for AutoCAD?', 'Electrical drawings generates layouts and a single-line diagram from room sizes and saves them as DXF. Drawing review reads your existing DXF drawings back in.', 'drawings'],
  ['How do I get a bill of quantities?', 'Bill of quantities is generated from the design. Set the expansion allowance and save as CSV or in the Excel workbook.', 'boq'],
  ['How do I fill in the LV certificate?', 'On LV certification & tests, complete the certificate fields and enter test readings for each circuit. The regional wording is a default you can edit.', 'lvcert'],
  ['How do I record commissioning tests?', 'Testing & commissioning lists every test from the design. Mark each passed or failed with the value, then save the record as PDF or CSV.', 'tc'],
  ['How do I make the handover pack?', 'Handover pack combines the certificate, schedules, test results, commissioning and assets into one PDF. Pick the sections and save.', 'handover'],
  ['How do I track documents and risks?', 'Documents & risks holds the document register (revision, status, review code A–D) and the risk register (likelihood × impact). Both can be started from the design.', 'registers'],
  ['How do I raise a maintenance ticket?', 'On FM operations, add a ticket, choose the trade and the issue – priority and description fill in – then record attended and completed times.', 'fm'],
  ['What is the SLA based on?', 'Response and completion targets by priority P1–P4, set on FM operations. Tickets attended or closed late count against the SLA.', 'fm'],
  ['How do I build the asset register?', 'On Assets & maintenance use "Add assets from the design", then set year, cost and condition to get maintenance plans, depreciation and replacement dates.', 'assets'],
  ['How do I export to Excel?', 'The project workbook (.xlsx) is on the Project dashboard, Handover pack and Design report; Facilities report and FM operations have the facilities workbook. CSV exports are on each register and schedule.', 'report'],
  ['How do I print or save a PDF?', 'Use the save-as-PDF buttons on the report pages, then choose "Save as PDF" as the printer in your browser’s print window.', 'report'],
  ['Is this a certified design?', 'No. Results are a design pre-check, not certification. Confirm standards and limits with the local authority and network operator, and certify the design yourself.', 'coverage'],
  ['How do I register?', 'On the Welcome page enter your name and pick your role, then press Register. It stays in this browser and nothing is sent anywhere. Until you register the app is view only.', 'home'],
  ['Where are my tasks?', 'My tasks shows what needs doing in your stages, worked out from the project, and the team tasks assigned to your role.', 'tasks'],
  ['How do roles work?', 'Register your role on the Welcome page: design engineer, implementation & deployment, facilities engineer, facility manager, energy manager, asset manager or project lead. The menu, Welcome page and Advisor follow it, and stages owned by other roles open view only. The role is kept in your browser, not in the project file.', 'home'],
  ['Is my data private?', 'Yes. The project stays in this browser – nothing is uploaded. Share it only by saving files yourself.', 'home'],
  ['Data centre sizing', 'Data centre sizes by area, racks or IT load with Tier redundancy. Pick a platform to fill density and liquid cooling, then review UPS and generators.', 'data-centre'],
  ['Lifts and escalators', 'Lifts & pumps sizes motors and group demand. Maintenance, call-outs and lift assets are added from the design on FM operations and Assets & maintenance.', 'lifts-pumps'],

function advSearch(q) {
  const w = String(q || '').toLowerCase().split(/[^a-z0-9]+/).filter(x => x.length > 2 || /^(zs|pv|hv|lv|md|tc|fm|pf)$/.test(x));
  if (!w.length) return ADV_HELP.slice(0, 8);
  return ADV_HELP.map(h => { const t = (h[0] + ' ' + h[1] + ' ' + vName(h[2])).toLowerCase(), q0 = h[0].toLowerCase(); return [w.reduce((a, x) => a + (q0.includes(x) ? 3 : 0) + (t.includes(x) ? 1 : 0) + (t.includes(x.slice(0, 4)) ? 0.5 : 0), 0), h]; })
    .filter(x => x[0] > 0).sort((a, b) => b[0] - a[0]).slice(0, 8).map(x => x[1]);
}
function advHelpHtml(q) { const r = advSearch(q); return r.length ? r.map(h => '<details><summary>' + esc(h[0]) + '</summary><p>' + esc(h[1]) + '</p><a href="#' + h[2] + '">Go to ' + esc(vName(h[2])) + ' →</a></details>').join('') : '<p class="note">No match. Try other words, such as “cable”, “certificate”, “ticket” or “export”.</p>'; }

const FAQ_CATS = [['start', 'Getting started & support', ['home', 'faq', 'tasks', 'project', 'admin', 'dashboard', 'coverage']], ['elec', 'Electrical design', ['sizing', 'circuits', 'checklist', 'drawings', 'review', 'data-centre', 'lifts-pumps', 'energy', 'area', 'equipment', 'compliance']], ['mep', 'Mechanical, plumbing & treatment', ['mech', 'plumb', 'treat', 'mepcomp']], ['rec', 'Certificates, records & handover', ['lvcert', 'tc', 'handover', 'registers', 'report', 'boq']], ['fm', 'Facilities & assets', ['fm', 'assets', 'fmreport', 'facilities']]];
function faqCat(h) { return (FAQ_CATS.find(c => c[2].includes(h[2])) || FAQ_CATS[0])[0]; }
let FAQ_Q = '';
function faqItem(h) { return '<details><summary>' + esc(h[0]) + '</summary><p>' + esc(h[1]) + '</p>' + (h[2] === 'faq' ? '<button class="btn small" data-act="chat-open">💬 Open the help assistant</button>' : '<a href="#' + h[2] + '">Go to ' + esc(vName(h[2])) + ' →</a>') + '</details>'; }
function faqResHtml(q) {
  if (String(q || '').trim()) { const r = advSearch(q); return r.length ? '<h3>Best matches</h3>' + r.map(faqItem).join('') : '<p class="note">No match. Try other words, or ask the help assistant or the developer below.</p>'; }
  return FAQ_CATS.map(c => { const it = ADV_HELP.filter(h => faqCat(h) === c[0]); return it.length ? '<h3 id="faq-' + c[0] + '">' + esc(c[1]) + '</h3>' + it.map(faqItem).join('') : ''; }).join('');
}
V.faq = () => '<section class="sheet faq">' + head('Help', 'Frequently asked questions', ADV_HELP.length + ' answers about using the app, grouped by topic. Search them, or ask the help assistant – it answers from these FAQs and your project.', '<button class="btn small primary" data-act="chat-open">💬 Ask the help assistant</button><a class="btn small ghost" href="#contact">✉ Contact the developer</a>')
  + '<label for="faqQ" class="note">Search the FAQ</label><input id="faqQ" class="q" type="search" autocomplete="off" placeholder="e.g. voltage drop, save, certificate" value="' + esc(FAQ_Q) + '">'

document.addEventListener('click', e => { const a = e.target && e.target.closest && e.target.closest('a[data-faq]'); if (!a) return; e.preventDefault(); FAQ_Q = ''; const q = document.getElementById('faqQ'); if (q) q.value = ''; const r = document.getElementById('faqRes'); if (r) r.innerHTML = faqResHtml(''); const h = document.getElementById('faq-' + a.dataset.faq); if (h && h.scrollIntoView) h.scrollIntoView({ block: 'start' }); });

      : { t: 'Register your role on the Welcome page, set the country on Project & region, then add loads.', ln: [['#home', 'Go to Welcome →']] };

  const q = lo.split(/[^a-z0-9]+/).filter(w => w.length > 1 && !CHAT_STOP.has(w)).join(' ');

  const btns = [['All', 'Hard + soft'], ['Hard', 'Hard services'], ['Soft', 'Soft services']].map(([k, t]) => `<button class="btn small ${M.sc === k ? 'primary' : ''}" data-act="fmb-scope" data-v="${k}" aria-pressed="${M.sc === k}">${t}</button>`).join('');
  const empty = !M.tk.length && !M.con.length && !M.qty && !(S.soft || []).length;
  const cVar = M.cB ? (M.cA - M.cB) / M.cB * 100 : NaN, oVar = M.oB ? (M.oA - M.oB) / M.oB * 100 : NaN, oYoy = M.oL ? (M.oA - M.oL) / M.oL * 100 : NaN;
  const mttrTxt = isFinite(M.mttr) ? `${f1(M.mttr)} h` : '–', mtbfTxt = M.noFail ? 'No failures' : isFinite(M.mtbf) ? `${f0(M.mtbf)} d` : '–';
  const exec = [
    ['SLA achievement', fbP(M.sla), `Target ≥ ${T.sla}%`, M.st.sla], ['PPM compliance', fbP(M.ppm), `Target ≥ ${T.ppm}%`, M.st.ppm],
    ['MTTR', mttrTxt, `Target ≤ ${T.mttr} h`, M.st.mttr], ['MTBF', mtbfTxt, `Target ≥ ${T.mtbf} d`, M.st.mtbf],
    ['CAPEX (YTD)', `${cur} ${f0(M.cA)}`, `Budget ${f0(M.cB)} (${fbVs(M.cA, M.cB)})`, M.cB && M.cA > M.cB ? 'bad' : M.cB ? 'ok' : 'na'],
    ['OPEX (YTD)', `${cur} ${f0(M.oA)}`, `vs last year ${fbSigned(oYoy)}`, M.oB ? (M.oA > M.oB ? 'bad' : 'ok') : 'na'],
    ['Work orders completed', fbP(M.wo.pct), `${f0(M.wo.completed)} of ${f0(M.wo.total)}`, fbHi(M.wo.pct, T.ppm)], ['Customer satisfaction', fbP(M.csat), `Target ≥ ${T.csat}%`, M.st.csat],
    ['Critical incidents (P1)', String(M.sevs[0].n), `${M.critOpen} open`, M.critOpen ? 'bad' : 'ok'], ['CO₂ reduction', isFinite(M.en.co2Red) ? `${f1(M.en.co2Red)} t` : '–', 'vs last year', isFinite(M.en.co2Red) ? (M.en.co2Red >= 0 ? 'ok' : 'warn') : 'na'],
  ].map(([l, v, s, st]) => `<div class="kpi fm-k ${st}"><span>${l}</span><b>${v}</b><small>${esc(s)}</small></div>`).join('');
  const gauges = [
    fbGauge('SLA achievement', M.slaFromTk ? 'Tickets fixed within SLA' : 'Contractor-reported SLA', fbP(M.sla), M.sla / 100, M.st.sla, `Target ≥ ${T.sla}%`),
    fbGauge('PPM compliance', 'Planned maintenance completed', fbP(M.ppm), M.ppm / 100, M.st.ppm, `Target ≥ ${T.ppm}%`),
    fbGauge('MTTR', 'Mean time to repair (tickets)', mttrTxt, isFinite(M.mttr) ? M.mttr / (2 * T.mttr) : 0, M.st.mttr, `Target ≤ ${T.mttr} h`),
    fbGauge('MTBF', 'Mean time between failures', mtbfTxt, M.noFail ? 1 : M.mtbf / (1.5 * T.mtbf), M.st.mtbf, `Target ≥ ${T.mtbf} days`),
    fbGauge('Asset availability', 'Assets in service', fbP(M.avail), M.avail / 100, M.st.avail, `Target ≥ ${T.avail}%`),
    fbGauge('Customer satisfaction', `Survey response ${fbHas(B.csatResp) ? B.csatResp + '%' : '–'}`, fbP(M.csat), M.csat / 100, M.st.csat, `Target ≥ ${T.csat}%`),
  ].join('');
  const tot = M.tk.length, cols = ['var(--bad)', 'var(--accent)', 'var(--warn)', 'var(--ok)'];
  let acc = 0; const stops = M.sevs.map((s, i) => { const a0 = acc; acc += tot ? s.n / tot * 100 : 0; return `${cols[i]} ${a0.toFixed(2)}% ${acc.toFixed(2)}%`; }).join(',');
  const incT = fbTile('t4', 'Incident summary', `<div class="donut-w"><div class="donut" style="background:${tot ? `conic-gradient(${stops})` : 'var(--sunk)'}" role="img" aria-label="${tot} tickets"><div><b class="num">${tot}</b><span>Total</span></div></div>
    <ul class="leg">${M.sevs.map((s, i) => `<li><i style="background:${cols[i]}"></i>${s.name} (${s.p})<b class="num">${s.n}</b><span>${tot ? Math.round(s.n / tot * 100) : 0}%</span></li>`).join('')}</ul></div>
    <div class="oc"><div class="kpi ${M.open ? 'bad' : 'ok'} fm-k"><span>Open</span><b>${M.open}</b></div><div class="kpi ok fm-k"><span>Closed</span><b>${tot - M.open}</b></div></div><p class="note">From the helpdesk tickets in FM operations raised in the period.</p>`);
  const conT = fbTile('t12', `Service contracts, SLA, PPM & compliance <small>${scopeTxt}</small>`, fbTbl(['Service', 'Type', 'Contractor / ref', 'Annual value', 'SLA', 'PPM', 'Audit score', 'Contract'],
    M.con.map(r => `<tr><td>${esc(r.c.name)}</td><td>${pill(r.c.kind === 'Hard' ? 'hard' : 'soft', r.c.kind)}</td><td>${esc(r.c.contractor)}${r.c.cref ? ` <span class="note">${esc(r.c.cref)}</span>` : ''}</td><td class="n">${fbHas(r.c.value) ? f0(+r.c.value) : '–'}</td><td class="n">${fbP(r.sla)} ${fbTick(r.slaSt)}</td><td class="n">${fbP(r.ppm)} ${fbTick(r.ppmSt)}</td><td class="n">${fbP(r.audit)} ${fbTick(r.auditSt)}</td><td>${pill(r.exp[0], r.exp[1])}</td></tr>`).join(''),
    M.con.length ? `<tr class="total"><td colspan="3">Total / average</td><td class="n">${f0(M.value)}</td><td class="n">${fbP(M.sla)}</td><td class="n">${fbP(M.ppm)}</td><td class="n">${fbP(M.contract)}</td><td>${M.expiring ? pill('warn', `${M.expiring} to renew`) : pill('ok', 'All current')}</td></tr>` : '', 'No service contracts yet – add them in FM board inputs.'));
  const softT = M.sc === 'Hard' ? '' : fbTile('t4', 'Soft services KPI', fbTbl(['Service', 'KPI', 'Status'], M.soft.map(r => `<tr><td>${esc(r.c.n)}</td><td class="n">${fbHas(r.x.kpi) ? fbP(+r.x.kpi) : '–'}</td><td>${pill(r.st, r.st === 'ok' ? 'Performing' : r.st === 'warn' ? 'Watch' : 'Action')}</td></tr>`).join(''), '', 'No soft services recorded in FM operations.'));
  const sopT = fbTile('t4', 'SOP compliance overview', fbTbl(['SOP category', 'Type', 'Compliance', ''], M.sop.map(r => `<tr><td>${esc(r.name)}</td><td>${esc(r.kind)}</td><td class="n">${fbP(fbN(r.pct))}</td><td>${fbTick(fbHi(fbN(r.pct), T.sop))}</td></tr>`).join(''),
    M.sop.length ? `<tr class="total"><td colspan="2">Average</td><td class="n">${fbP(M.sopAvg)}</td><td>${pill(M.st.sop, FB_ST[M.st.sop])}</td></tr>` : ''));
  const mttrT = fbTile('t6', 'MTTR by equipment', fbTbl(['Equipment', 'Repairs', 'MTTR h', 'Target h', '', 'vs target'], M.eq.filter(g => g.ttr.length).map(g => { const s = fbLo(g.mttr, T.mttr); return `<tr><td>${esc(g.name)}</td><td class="n">${g.ttr.length}</td><td class="n">${f1(g.mttr)}</td><td class="n">${f1(T.mttr)}</td><td>${fbBar(g.mttr / (2 * T.mttr), s)}</td><td class="n">${fbVs(g.mttr, T.mttr)}</td></tr>`; }).join(''), '', 'No completed tickets against registered assets in the period.'));
  const mtbfT = fbTile('t6', 'MTBF by equipment', fbTbl(['Equipment', 'Units', 'Failures (12 mo)', 'MTBF d', '', 'vs target'], M.eq.map(g => { const s = g.fails ? fbHi(g.mtbf, T.mtbf, T.mtbf * 0.1) : 'ok'; return `<tr><td>${esc(g.name)}</td><td class="n">${g.qty}</td><td class="n">${g.fails}</td><td class="n">${g.fails ? f0(g.mtbf) : '> 365'}</td><td>${fbBar(g.fails ? g.mtbf / (1.5 * T.mtbf) : 1, s)}</td><td class="n">${g.fails ? fbVs(g.mtbf, T.mtbf) : 'No failures'}</td></tr>`; }).join(''), '', 'No assets in the asset register.'));
  const en = M.en, eRow = (l, v, good) => `<tr><td>${l}</td><td class="n">${v}</td><td>${good == null ? '' : pill(good ? 'ok' : 'warn', good ? '▼' : '▲')}</td></tr>`;
  const enT = fbTile('t4', 'Energy & water KPI', fbTbl(['Indicator', 'Value', ''], [
    eRow('Electricity (kWh)', f0(en.kwh), isFinite(en.kwhChg) ? en.kwhChg <= 0 : null), eRow('Change vs last year', fbSigned(en.kwhChg)),
    eRow('Energy intensity (kWh/m²)', isFinite(en.eui) ? f1(en.eui) : '–'), eRow(`Floor area (m²)${fbHas(B.energy.area) ? '' : ' – area schedule'}`, f0(en.area)),
    eRow(`CO₂ emitted (t) @ ${f2(en.co2f)} kg/kWh`, f1(en.co2)), eRow('CO₂ reduction (t)', isFinite(en.co2Red) ? f1(en.co2Red) : '–', isFinite(en.co2Red) ? en.co2Red >= 0 : null),
    eRow('Water consumed (m³)', f0(en.water), isFinite(en.waterChg) ? en.waterChg <= 0 : null)].join('')));
  const capT = fbTile('t6', 'CAPEX summary', fbTbl(['Project', 'Complete', 'Budget', 'Spent', 'Variance', 'RAG'], M.pr.map(r => { const v = r.budget ? (r.spent - r.budget) / r.budget * 100 : NaN; return `<tr><td>${esc(r.p.name)}</td><td class="n">${fbN(r.p.pct)}%</td><td class="n">${f0(r.budget)}</td><td class="n">${f0(r.spent)}</td><td class="n">${isFinite(v) ? v.toFixed(1) + '%' : '–'}</td><td>${pill(r.rag === 'Red' ? 'bad' : r.rag === 'Amber' ? 'warn' : 'ok', r.rag)}</td></tr>`; }).join(''),
    M.pr.length ? `<tr class="total"><td colspan="2">Total (${cur})</td><td class="n">${f0(M.cB)}</td><td class="n">${f0(M.cA)}</td><td class="n">${isFinite(cVar) ? cVar.toFixed(1) + '%' : '–'}</td><td></td></tr>` : '', 'No capital projects in FM operations.'));
  const opT = fbTile('t6', 'OPEX summary (YTD)', fbTbl(['Category', 'Type', 'Budget', 'Actual', 'Variance', 'Y/Y'], M.opex.map(r => { const b = fbN(r.budget), a = fbN(r.actual), l = fbN(r.ly), v = b ? (a - b) / b * 100 : NaN, yy = l ? (a - l) / l * 100 : NaN; return `<tr><td>${esc(r.name)}</td><td>${esc(r.kind)}</td><td class="n">${f0(b)}</td><td class="n">${f0(a)}</td><td class="n ${v > 0 ? 'neg' : ''}">${isFinite(v) ? v.toFixed(1) + '%' : '–'}</td><td class="n">${fbSigned(yy)}</td></tr>`; }).join(''),
    M.opex.length ? `<tr class="total"><td colspan="2">Total (${cur})</td><td class="n">${f0(M.oB)}</td><td class="n">${f0(M.oA)}</td><td class="n">${isFinite(oVar) ? oVar.toFixed(1) + '%' : '–'}</td><td class="n">${fbSigned(oYoy)}</td></tr>` : ''));
  const w = M.wo, woRow = (l, v, s) => `<tr><td>${l}</td><td class="n"><b>${v}</b></td><td>${s ? fbTick(s) : ''}</td></tr>`;
  const woT = fbTile('t4', 'Work order KPI', fbTbl(['Measure', 'Value', ''], [woRow('Total work orders (PPM + reactive)', f0(w.total)), woRow('Planned (PPM) issued / completed', `${f0(w.ppmPlan)} / ${f0(w.ppmDone)}`), woRow('Reactive tickets raised / closed', `${f0(w.tk)} / ${f0(w.closed)}`), woRow('Completed', f0(w.completed), fbHi(w.pct, T.ppm)), woRow('In progress', f0(w.prog)), woRow('Overdue', f0(w.overdue), w.overdue ? 'bad' : 'ok'), woRow('On-time completion', fbP(w.onTime), fbHi(w.onTime, T.sla)), woRow('Backlog older than 7 days', f0(w.backlog), w.backlog ? 'warn' : 'ok')].join('')));
  const csT = fbTile('t4', 'Customer satisfaction', fbTbl(['Dimension', 'Score', ''], M.cs.map(r => `<tr><td>${esc(r.name)}</td><td class="n">${fbP(+r.score)}</td><td>${fbTick(fbHi(+r.score, T.csat))}</td></tr>`).join(''),
    `<tr class="total"><td>Overall satisfaction</td><td class="n">${fbP(M.csat)}</td><td>${pill(M.st.csat, FB_ST[M.st.csat])}</td></tr><tr><td>Survey response rate</td><td class="n">${fbHas(B.csatResp) ? fbP(+B.csatResp) : '–'}</td><td></td></tr>`));
  const amT = fbTile('t8', 'Asset management KPI', `<div class="kpis">${[['Asset availability', fbP(M.avail), M.st.avail], ['PPM / renewal compliance', fbP(M.ppm), M.st.ppm], ['Asset health index', fbP(M.health), fbHi(M.health, 85, 10)], ['Mean time to failure', M.noFail ? 'No failures' : isFinite(M.mtbf) ? `${f1(M.mtbf / 365)} yrs` : '–', M.st.mtbf], ['SOP compliance rate', fbP(M.sopAvg), M.st.sop], ['Assets in poor condition', String(M.poor), M.poor ? 'warn' : M.qty ? 'ok' : 'na']].map(([l, v, s]) => `<div class="kpi fm-k ${s}"><span>${l}</span><b>${v}</b></div>`).join('')}</div>`);
  const sf = B.safety, num = (v) => fbHas(v) ? +v : NaN, sRow = (l, v, s) => `<tr><td>${l}</td><td class="n">${v}</td><td>${fbTick(s)}</td></tr>`;
  const sfT = fbTile('t4', 'Safety & fire compliance', fbTbl(['Measure', 'Value', ''], [sRow('Fire system availability', fbP(num(sf.fireAvail)), fbHi(num(sf.fireAvail), 99, 1)), sRow('Emergency lights operational', fbP(num(sf.emLights)), fbHi(num(sf.emLights), 98, 2)), sRow('Fire drills conducted', `${fbHas(sf.drills) ? +sf.drills : '–'} / ${fbN(sf.drillsT)}`, fbHas(sf.drills) ? (+sf.drills >= fbN(sf.drillsT) ? 'ok' : 'warn') : 'na'), sRow('Safety training completion', fbP(num(sf.training)), fbHi(num(sf.training), 95)), sRow('Lost time incidents', fbHas(sf.lti) ? f0(+sf.lti) : '–', fbHas(sf.lti) ? (+sf.lti ? 'bad' : 'ok') : 'na'), sRow('Fire alarm false alarms', fbHas(sf.falseAlarms) ? f0(+sf.falseAlarms) : '–', fbHas(sf.falseAlarms) ? (+sf.falseAlarms > 3 ? 'warn' : 'ok') : 'na')].join('')));
  const stT = fbTile('t4', 'Optimisation strategies', `<ul class="strat">${FMB_STRAT.map(([k, t]) => `<li class="${B.strat[k] ? 'on' : ''}">${pill(B.strat[k] ? 'ok' : 'na', B.strat[k] ? '✓' : '–')} ${t}</li>`).join('')}</ul>`);
  const period = `${esc(B.start || '…')} to ${esc(B.end || 'today')} (${M.days} days)`;

  ${empty ? `<p class="callout">No FM records yet. Enter tickets, assets and soft services in <a href="#fm">FM operations</a> and <a href="#assets">Assets &amp; maintenance</a>, add service contracts in <a href="#fmboardin">FM board inputs</a>, or <button class="btn small" data-act="fmb-example">load example FM data</button> to see a filled board.</p>` : ''}
  <div class="fmb">${fbTile('t12', 'Executive summary', `<div class="kpis exec">${exec}</div>`)}${gauges}${incT}${sopT}${softT || ''}${enT}${conT}${mttrT}${mtbfT}${capT}${opT}${woT}${csT}${sfT}${amT}${stT}</div>
  <p class="note">SLA = tickets fixed within their priority SLA ÷ tickets judged (when there are no tickets, the average contractor-reported SLA). MTTR = mean hours from raising to completing a ticket. MTBF = units × 365 days ÷ failures in 12 months (asset register). Availability = units not marked "Not operating" ÷ units. Health index = condition grade factor weighted by units. PPM compliance = planned tasks completed ÷ planned tasks issued (service contracts). Contracts ending within 90 days are flagged for renewal.</p></section>`;
};

function fbTable(arr, cols, result) {
  const cell = (r, i, [k, h, t, o]) => t === 'sel' ? `<select data-arr="${arr}" data-i="${i}" data-k="${k}" aria-label="${esc(h)}" style="min-width:86px">${opt(o, r[k])}</select>`
    : `<input data-arr="${arr}" data-i="${i}" data-k="${k}" type="${t || 'text'}" ${t === 'number' ? 'step="any"' : ''} value="${esc(r[k] ?? '')}" aria-label="${esc(h)}"${o ? ` style="min-width:${o}"` : (!t || t === 'text') ? ' style="min-width:170px"' : ''}>`;
  const rows = (S[arr] || []).map((r, i) => `<tr>${cols.map(c => `<td>${cell(r, i, c)}</td>`).join('')}${result ? `<td class="n">${result(r, i)}</td>` : ''}<td><button class="btn small ghost" data-del="${arr}" data-i="${i}" aria-label="Remove row">Remove</button></td></tr>`).join('');
  return `<div class="tbl-wrap"><table><thead><tr>${cols.map(c => `<th>${c[1]}</th>`).join('')}${result ? '<th>Result</th>' : ''}<th></th></tr></thead><tbody>${rows || `<tr><td colspan="${cols.length + 2}" class="note">No rows yet.</td></tr>`}</tbody></table></div>`;
}
V.fmboardin = () => {
  if (!S.fmb || !Array.isArray(S.fmbContracts)) fmbUpgrade(S);

  return `<section class="sheet">${head('FM', 'FM board inputs', 'Targets, service contracts and the figures the FM stages do not already hold. Tickets, assets, soft services and capital projects come from FM operations and Assets & maintenance.', `<a class="btn primary" href="#fmboard">View performance board</a><button class="btn" data-act="fmb-example">Load example FM data</button>`)}
  <h3>Board settings</h3><div class="grid">${fld('Site / portfolio', inp('fmb.site', B.site, 'text', `placeholder="${esc(S.project.name || '')}"`))}${fld('Period start', inp('fmb.start', B.start, 'date'))}${fld('Period end', inp('fmb.end', B.end, 'date'), 'Blank = today')}${fld('Currency', inp('fmb.currency', B.currency, 'text', `placeholder="${esc((S.energy && S.energy.currency) || '')}"`))}${fld('Board shows', sel('fmb.scope', [{ v: 'All', t: 'Hard + soft services' }, { v: 'Hard', t: 'Hard services only' }, { v: 'Soft', t: 'Soft services only' }], B.scope))}</div>
  <h3>Targets</h3><div class="grid">${tg.map(([k, h]) => num(`fmb.targets.${k}`, T[k], h)).join('')}</div></section>
  <section class="sheet">${head('FM', 'Service contracts, SLA & PPM', 'One row per hard or soft service contract: contractor, term, value, SLA and planned maintenance (PPM) completion, and the KPI audit score.', `<button class="btn" data-act="fmb-add" data-v="Hard">Add hard service</button><button class="btn" data-act="fmb-add" data-v="Soft">Add soft service</button><button class="btn small" data-act="fmb-std" data-v="Hard">Add standard hard services</button><button class="btn small" data-act="fmb-std" data-v="Soft">Add standard soft services</button>`)}
  ${fbTable('fmbContracts', cCols, (r) => { const p = fbN(r.ppmPlan); return `PPM ${p ? fbP(Math.min(fbN(r.ppmDone), p) / p * 100) : '–'}`; })}</section>
  <section class="sheet">${head('FM', 'SOP compliance', 'Compliance % per standard operating procedure category (procedures followed ÷ procedures audited).', `<button class="btn" data-add="fmbSop">Add SOP category</button>`)}
  ${fbTable('fmbSop', [['name', 'SOP category'], ['kind', 'Applies to', 'sel', FMB_KINDS_B], ['pct', 'Compliance %', 'number']])}</section>
  <section class="sheet">${head('FM', 'OPEX', 'Year-to-date operating budgets and actuals. CAPEX comes from the capital projects in FM operations.', `<button class="btn" data-add="fmbOpex">Add OPEX category</button>`)}
  ${fbTable('fmbOpex', [['name', 'Category'], ['kind', 'Type', 'sel', FMB_KINDS_B], ['budget', 'Budget', 'number'], ['actual', 'Actual', 'number'], ['ly', 'Last year (same period)', 'number']])}</section>
  <section class="sheet">${head('FM', 'Customer satisfaction', 'Survey scores per dimension (0–100). The overall score is their average.', `<button class="btn" data-add="fmbCsat">Add dimension</button>`)}
  <div class="grid" style="margin-bottom:10px">${num('fmb.csatResp', B.csatResp, 'Survey response rate %')}</div>${fbTable('fmbCsat', [['name', 'Dimension'], ['score', 'Score %', 'number']])}</section>

  if (act === 'dl-csv') save(`${S.project.ref || 'project'}-load-schedules.csv`, csvSchedules(), 'Schedules');
  if (act === 'copy-report') { const t = $('#paper').innerText; try { await navigator.clipboard.writeText(t); toast('Report text copied'); } catch (err) { const r = document.createRange(); r.selectNodeContents($('#paper')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('Report selected – press Ctrl+C to copy'); } }
});
let DL = null; (async () => { try { DL = await window.claude?.use?.('downloads'); } catch (e) { DL = null; } })();
async function save(name, data, what) {
  if (!DL && !window.claude) {
    // Standalone website: use a normal browser download.
    const type = /\.html$/.test(name) ? 'text/html' : /\.csv$/.test(name) ? 'text/csv' : /\.dxf$/.test(name) ? 'application/dxf' : /\.svg$/.test(name) ? 'image/svg+xml' : /\.xlsx$/.test(name) ? 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' : 'application/json';
    const url = URL.createObjectURL(new Blob([data], { type: /\.xlsx$/.test(name) ? type : type + ';charset=utf-8' }));
    const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000); toast(`${what} downloaded`); return;
  }
  if (!DL) { toast('Saving files is not available in this view. Use "Copy report text" instead.'); return; }
  try { await DL.save({ filename: name, data }); toast(`${what} saved`); }
  catch (err) { const c = err && err.code; toast(c === 'declined' ? 'Save cancelled' : c === 'rate_limited' ? 'A save is already waiting for your answer' : 'This file could not be saved here'); }
}

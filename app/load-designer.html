<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: switchroom-panel app — sticky status band, numbered design-stage rail, working sheet; report renders as an A4 calc document */
:root{
  --bg:#eef0ec; --panel:#ffffff; --sunk:#f6f7f4; --ink:#1b2220; --muted:#5b6662; --line:#d3d8d2; --line-strong:#a9b2ac;
  --accent:#b9471a; --accent-soft:#f6e3d8; --on-accent:#ffffff;
  --ok:#2c7a4b; --ok-soft:#dcefe3; --warn:#9a6a0b; --warn-soft:#f6ecd2; --bad:#b0281f; --bad-soft:#f7dcd9;
  --input:#fffdf6; --input-line:#cdbf94;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow","Segoe UI",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",Consolas,"Courier New",monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121715; --panel:#1a201e; --sunk:#151a18; --ink:#e3e8e4; --muted:#98a39e; --line:#2c3531; --line-strong:#47524d;
  --accent:#ef7d43; --accent-soft:#3a2418; --on-accent:#1a0e07;
  --ok:#5fc08a; --ok-soft:#183324; --warn:#e0b14e; --warn-soft:#33290f; --bad:#f07d73; --bad-soft:#3b1a17;
  --input:#1f2421; --input-line:#5a5236; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121715; --panel:#1a201e; --sunk:#151a18; --ink:#e3e8e4; --muted:#98a39e; --line:#2c3531; --line-strong:#47524d;
  --accent:#ef7d43; --accent-soft:#3a2418; --on-accent:#1a0e07;
  --ok:#5fc08a; --ok-soft:#183324; --warn:#e0b14e; --warn-soft:#33290f; --bad:#f07d73; --bad-soft:#3b1a17;
  --input:#1f2421; --input-line:#5a5236; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:.01em;text-wrap:balance;margin:0}
.num,td.n,input[type=number]{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* status band */
.band{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.band-in{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;padding-block:10px;max-width:1400px;margin:0 auto}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{font-size:22px;white-space:nowrap}
.brand .proj{color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:28ch}
.readouts{display:flex;flex-wrap:wrap;gap:6px 18px;margin-left:auto}
.ro{display:flex;flex-direction:column;line-height:1.1}
.ro span{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.ro b{font-family:var(--f-mono);font-weight:500;font-size:17px}
.ro.main b{color:var(--accent)}

/* shell */
.shell{display:grid;grid-template-columns:230px minmax(0,1fr);gap:22px;max-width:1400px;margin:0 auto;padding-block:20px 60px}
nav.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 74px);align-self:start;display:flex;flex-direction:column;gap:2px}
nav.rail a{display:grid;grid-template-columns:26px 1fr auto;align-items:center;gap:8px;padding:8px 10px;border-radius:6px;color:var(--ink);text-decoration:none;font-weight:500}
nav.rail a .k{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
nav.rail a:hover{background:var(--sunk)}
nav.rail a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
nav.rail a[aria-current="page"] .k{color:var(--accent)}
.dot{width:8px;height:8px;border-radius:50%;background:transparent}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}
.rail-foot{margin-top:14px;padding:12px 10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;font-size:13px;color:var(--muted)}

main{min-width:0;display:flex;flex-direction:column;gap:18px}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:20px 22px;min-width:0}
.sheet-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:14px}
.sheet-head h2{font-size:26px}
.sheet-head p{margin:2px 0 0;color:var(--muted);max-width:70ch}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:600}
h3{font-size:18px;margin:18px 0 8px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px 16px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;color:var(--muted);font-weight:500}
.field .hint{font-size:11.5px;color:var(--muted)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--input);border:1px solid var(--input-line);border-radius:5px;padding:6px 8px;min-width:0;width:100%}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.derived{font-family:var(--f-mono);padding:6px 8px;border:1px dashed var(--line-strong);border-radius:5px;background:var(--sunk);min-height:34px;overflow-wrap:anywhere}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{background:var(--sunk);text-align:left;font-weight:600;font-size:12px;color:var(--muted);padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0}
td{padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n{text-align:right;white-space:nowrap}
td input,td select{padding:4px 6px;font-size:13.5px}
td input[type=number]{width:88px;text-align:right}
td.wide input,td.wide select{min-width:220px}
tr.total td{font-weight:600;background:var(--sunk)}
.btn{font:inherit;font-weight:600;border-radius:6px;padding:8px 14px;border:1px solid var(--line-strong);background:var(--panel);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.small{padding:4px 9px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--bad)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.na{background:var(--sunk);color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--sunk)}
.kpi span{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kpi b{font-family:var(--f-mono);font-weight:500;font-size:20px}
.kpi small{color:var(--muted);display:block}
.dwg-wrap{border:1px solid var(--line);border-radius:6px;background:#fff;color:#1b1f1d;overflow:auto;max-height:70vh;padding:8px}.dwg-wrap svg{width:100%;min-width:900px;height:auto;display:block}
.note{font-size:12.5px;color:var(--muted);max-width:90ch}
.callout{border-left:3px solid var(--warn);background:var(--warn-soft);padding:8px 12px;border-radius:0 6px 6px 0;font-size:13.5px}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:6px;font-weight:500;z-index:20}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.bar{height:10px;border-radius:5px;background:var(--sunk);overflow:hidden;display:flex}
.bar i{display:block;height:100%}

/* report preview */
.paper{background:#fff;color:#1b1f1d;border:1px solid var(--line);border-radius:4px;max-width:900px;margin:0 auto;padding:36px 40px;box-shadow:0 1px 0 var(--line)}
.paper *{color:inherit}
@media (max-width:900px){.shell{grid-template-columns:1fr}nav.rail{position:static;flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}nav.rail a{grid-template-columns:auto auto auto;white-space:nowrap}.rail-foot{display:none}.split{grid-template-columns:1fr}.paper{padding:20px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

  const L = [['NexvoraHub Studio – regional coverage register', 'v' + COV.version, 'as of ' + COV.asOf].map(q).join(','), ['Country / region', 'Code family', 'Wiring regulations', 'Supply', 'Status', 'Cable data', 'Socket system', 'Lighting points rule', 'Verified edition', 'Verified date', 'Verified by', 'Ready to sell', 'Notes'].map(q).join(',')];
  coverageAll().rows.forEach(r => L.push([r.name, FAMILY_NAME[r.fam] || r.fam, r.regs, r.supply, r.label, r.cable, r.socket + (r.sockMapped ? '' : ' (assumed)'), r.lightRule, r.verified?.edition, r.verified?.date, r.verified?.by, r.ready ? 'Yes' : 'No', r.notes.join(' ')].map(q).join(',')));

}
